<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ritten – Kilometerregistratie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#13202C; --muted:#586979; --line:#D3DAE1;
  --blue:#0A4C99; --on-blue:#FFFFFF; --yellow:#FFC40D; --on-yellow:#1B1500;
  --odo-bg:#13202C; --odo-ink:#F5F7F9; --danger:#B3261E; --focus:#0A4C99;
  --f-head:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1319; --surface:#162029; --ink:#E9EEF2; --muted:#93A4B3; --line:#263440;
    --blue:#2D6CC0; --on-blue:#FFFFFF; --yellow:#FFC40D; --on-yellow:#1B1500;
    --odo-bg:#080C10; --odo-ink:#F5F7F9; --danger:#FF8A80; --focus:#8DB8F2;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1319; --surface:#162029; --ink:#E9EEF2; --muted:#93A4B3; --line:#263440;
  --blue:#2D6CC0; --on-blue:#FFFFFF; --yellow:#FFC40D; --on-yellow:#1B1500;
  --odo-bg:#080C10; --odo-ink:#F5F7F9; --danger:#FF8A80; --focus:#8DB8F2;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 56px}

.top{display:flex;justify-content:space-between;align-items:center;min-height:48px}
.top h1{font-family:var(--f-head);font-weight:600;font-size:24px;margin:0;letter-spacing:.01em}
.link{background:none;border:0;padding:10px 4px;min-height:44px;color:var(--blue);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .link{color:var(--focus)}}
:root[data-theme="dark"] .link{color:var(--focus)}
.link.on-blue{color:var(--on-blue) !important}

.hero{background:var(--surface);border-radius:26px;padding:22px 20px 14px;margin-top:6px}
.hero.live{background:var(--blue);color:var(--on-blue)}
.odo-label{font-size:15px;color:var(--muted);margin:0 0 8px}
.odo-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:20px}
.odo{display:inline-flex;gap:3px}
.odo span{width:34px;height:46px;display:grid;place-items:center;background:var(--odo-bg);color:var(--odo-ink);
  border-radius:5px;font-family:var(--f-head);font-weight:600;font-size:32px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.45)}
.odo-unit{font-family:var(--f-head);font-size:20px;font-weight:600;padding-bottom:6px}
.hint{color:var(--muted);margin:0 0 18px}

.btn-start{display:block;width:100%;min-height:92px;border:0;border-radius:20px;background:var(--yellow);color:var(--on-yellow);
  font-family:var(--f-head);font-weight:700;font-size:34px;letter-spacing:.01em;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.btn-start:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn-start small{display:block;font-family:var(--f-body);font-weight:500;font-size:16px;margin-top:2px}
.hero .link{display:block;margin:8px auto 0}

.live-top{display:flex;align-items:center;gap:10px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:var(--yellow);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}.btn-start{transition:none}}
.elapsed{font-family:var(--f-head);font-weight:700;font-size:56px;line-height:1.05;margin:6px 0 4px}
.live-meta{opacity:.92;margin:0 0 18px}
.warn{background:rgba(255,255,255,.16);border-radius:12px;padding:10px 14px;margin:0 0 16px}

.totals{display:grid;grid-template-columns:repeat(3,1fr);margin:26px 0 4px}
.tot{padding:0 12px;border-left:1px solid var(--line)}
.tot:first-child{padding-left:0;border-left:0}
.tot-label{font-size:14px;color:var(--muted)}
.tot-km{font-family:var(--f-head);font-weight:600;font-size:30px;line-height:1.15}
.tot-km small{font-size:16px;font-weight:500;color:var(--muted)}
.tot-eur{font-size:15px;color:var(--muted)}

.month{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:30px 0 2px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.month h2{font-family:var(--f-head);font-weight:600;font-size:20px;margin:0;text-transform:capitalize}
.month span{color:var(--muted);font-size:15px}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:start;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer;min-height:56px}
.r-date{color:var(--muted);font-size:14px;padding-top:2px}
.r-route{display:block;font-weight:600}
.r-sub{display:block;color:var(--muted);font-size:14px}
.r-km{text-align:right;font-family:var(--f-head);font-weight:600;font-size:20px;white-space:nowrap}
.r-km small{display:block;font-family:var(--f-body);font-weight:400;font-size:14px;color:var(--muted)}
.empty{margin:36px 0 0;color:var(--muted)}

.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}
.export{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.export select{min-height:48px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:6px 12px}
.btn-line{min-height:48px;padding:0 18px;border:2px solid var(--ink);border-radius:12px;background:none;font-weight:600;cursor:pointer}
.note{color:var(--muted);font-size:15px;margin:14px 0 0}

dialog#sheet{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-width:100%;max-height:94dvh;
  border-radius:26px 26px 0 0;margin:auto auto 0;overflow:auto}
dialog#sheet::backdrop{background:rgba(8,14,20,.58)}
@media (min-width:600px){dialog#sheet{margin:auto;border-radius:26px}}
.sheet-in{padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sh-head h2{font-family:var(--f-head);font-weight:600;font-size:26px;margin:0}
.x{width:44px;height:44px;border:0;border-radius:50%;background:var(--bg);font-size:26px;line-height:1;cursor:pointer}
label.l{display:block;font-weight:600;margin:16px 0 6px}
.in{width:100%;min-height:54px;font-size:18px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.in:focus{border-color:var(--blue);outline:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:5px;border-radius:14px;margin-top:14px}
.seg button{min-height:46px;border:0;border-radius:10px;background:none;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.calc{font-family:var(--f-head);font-weight:600;font-size:24px;min-height:34px;margin:10px 0 0}
.check{display:flex;gap:10px;align-items:center;margin-top:12px;min-height:44px}
.check input{width:24px;height:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:46px;padding:0 16px;border:2px solid var(--line);border-radius:999px;font-weight:500}
.chip input:checked + span{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:600}
.chip input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.err{color:var(--danger);font-weight:600;min-height:1.5em;margin:12px 0 0}
.btn-primary{display:block;width:100%;min-height:62px;border:0;border-radius:16px;background:var(--blue);color:var(--on-blue);
  font-family:var(--f-head);font-weight:700;font-size:26px;letter-spacing:.01em;cursor:pointer;margin-top:10px}
.btn-quiet{display:block;width:100%;min-height:50px;border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-top:6px}
.btn-danger{display:block;width:100%;min-height:54px;border:2px solid var(--danger);border-radius:14px;background:none;color:var(--danger);font-weight:700;cursor:pointer;margin-top:12px}
.btn-danger.armed{background:var(--danger);color:var(--bg)}
textarea.in{min-height:220px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace}
p.sub{color:var(--muted);margin:4px 0 0}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
.loading{color:var(--muted);margin-top:40px}
</style>
</head>
<body>
<div class="wrap"><div id="app"><p class="loading">Laden…</p></div></div>
<dialog id="sheet" aria-labelledby="sheetTitle"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Deze pagina heeft JavaScript nodig.</noscript>

<script>
(function(){
'use strict';

var DOELEN = ['Klantbezoek','Overleg','Materiaal of inkoop','Netwerken','Opleiding','Anders'];
var state = { trips:[], active:null, settings:{rate:0.23}, kind:'local', downloads:null, exportYear:String(new Date().getFullYear()) };
var store = null;

/* ---------- helpers ---------- */
function $(s, el){ return (el||document).querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var nf = new Intl.NumberFormat('nl-NL',{maximumFractionDigits:1});
var nfi = new Intl.NumberFormat('nl-NL',{maximumFractionDigits:0});
var eur = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'});
function pad(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayISO(){ return isoDate(new Date()); }
function noonTs(datum){ return new Date(datum+'T12:00:00').getTime(); }
function timeStr(iso){ var d=new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function round1(n){ return Math.round(n*10)/10; }
function numKm(v){ var s=String(v==null?'':v).trim().replace(/\s/g,'').replace(',','.'); if(s==='') return NaN; return Number(s); }
function numStand(v){ var s=String(v==null?'':v).trim().replace(/[\s.]/g,'').replace(',','.'); if(s==='') return NaN; return Number(s); }
function newId(){ return 'rit_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function tripRate(t){ return t.rate!=null ? t.rate : state.settings.rate; }
function sortedTrips(){ return state.trips.slice().sort(function(a,b){ return (b.ts||0)-(a.ts||0); }); }
function lastKm(){ var s=sortedTrips(); for(var i=0;i<s.length;i++){ if(s[i].eindKm!=null) return s[i].eindKm; } return null; }
function lastNaar(){ var s=sortedTrips(); return s.length ? (s[0].naar||'') : ''; }
function elapsedText(iso){ var m=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000)); if(m<60) return m+' min'; return Math.floor(m/60)+' u '+pad(m%60)+' min'; }

var toastT;
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },3200); }

/* ---------- storage ---------- */
function makeLocalStore(){
  var KEY='ritten-v1';
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var d=JSON.parse(raw); state.trips=d.trips||[]; state.active=d.active||null; state.settings=Object.assign({rate:0.23},d.settings||{}); }
  }catch(e){}
  function persist(){
    try{ localStorage.setItem(KEY, JSON.stringify({trips:state.trips,active:state.active,settings:state.settings})); }
    catch(e){ toast('Opslaan in deze browser is niet gelukt.'); }
  }
  return {
    saveTrip:function(t){ var i=state.trips.findIndex(function(x){return x.id===t.id;}); if(i>=0) state.trips[i]=t; else state.trips.push(t); persist(); render(); return Promise.resolve(); },
    deleteTrip:function(id){ state.trips=state.trips.filter(function(x){return x.id!==id;}); persist(); render(); return Promise.resolve(); },
    setActive:function(a){ state.active=a; persist(); render(); return Promise.resolve(); },
    setSettings:function(s){ state.settings=Object.assign({},state.settings,s); persist(); render(); return Promise.resolve(); }
  };
}

function makeDbStore(db, uid){
  var col = db.collection('data/users/'+uid);
  col.onSnapshot(function(snap){
    var trips=[], active=null, settings={rate:0.23};
    snap.docs.forEach(function(d){
      var v=d.data(); if(!v) return;
      if(d.id==='instellingen'){ settings=Object.assign(settings,v); }
      else if(d.id==='actief'){ active = v.start ? Object.assign({},v) : null; }
      else if(d.id.indexOf('rit_')===0){ trips.push(Object.assign({},v,{id:d.id})); }
    });
    state.trips=trips; state.active=active; state.settings=settings; render();
  }, function(){
    store = makeLocalStore(); state.kind='local'; render();
    toast('Verbinding met je account is weggevallen. Je werkt nu lokaal in deze browser.');
  });
  return {
    saveTrip:function(t){ var o=Object.assign({},t); var id=o.id; delete o.id; return col.doc(id).set(o); },
    deleteTrip:function(id){ return col.doc(id).delete(); },
    setActive:function(a){ return a ? col.doc('actief').set(a) : col.doc('actief').delete(); },
    setSettings:function(s){ return col.doc('instellingen').set(Object.assign({},state.settings,s)); }
  };
}

/* ---------- views ---------- */
function odoHTML(km){
  var s=String(Math.round(km)).padStart(6,'0');
  return '<div class="odo" role="img" aria-label="Kilometerstand '+nfi.format(km)+' kilometer">'+
    s.split('').map(function(c){return '<span>'+c+'</span>';}).join('')+'</div><span class="odo-unit">km</span>';
}

function heroIdle(){
  var k=lastKm();
  var top = k!=null
    ? '<p class="odo-label">Laatste kilometerstand</p><div class="odo-row">'+odoHTML(k)+'</div>'
    : '<p class="hint">Tik op de knop als je gaat rijden. De eerste keer vraag ik je kilometerstand; daarna onthoud ik die.</p>';
  return '<section class="hero">'+top+
    '<button class="btn-start" data-act="start" type="button">Ik ga rijden</button>'+
    '<button class="link" data-act="manual" type="button">Ik ben al gereden, achteraf invullen</button></section>';
}

function heroLive(){
  var a=state.active;
  var sameDay = isoDate(new Date(a.start))===todayISO();
  var long = (Date.now()-new Date(a.start).getTime())>4*3600*1000 || !sameDay;
  var when = (sameDay ? '' : new Date(a.start).toLocaleDateString('nl-NL',{weekday:'long'})+' ')+'om '+timeStr(a.start);
  var meta = 'Gestart '+when+'.'+(a.beginKm!=null ? ' Beginstand '+nfi.format(a.beginKm)+' km.' : '');
  return '<section class="hero live" aria-live="polite">'+
    '<div class="live-top"><span class="dot" aria-hidden="true"></span><span>Rit loopt</span></div>'+
    '<div class="elapsed" id="elapsed">'+elapsedText(a.start)+'</div>'+
    '<p class="live-meta">'+esc(meta)+'</p>'+
    (long ? '<p class="warn">Deze rit loopt al lang. Klopt dat nog? Rond hem af, of annuleer als je niet gereden hebt.</p>' : '')+
    '<button class="btn-start" data-act="finish" type="button">Aangekomen<small>Kilometers invullen</small></button>'+
    '<button class="link on-blue" data-act="cancel" type="button">Rit annuleren</button></section>';
}

function totalsHTML(){
  var now=new Date(), y=now.getFullYear(), m=now.getMonth(), q=Math.floor(m/3);
  var tm=0,tq=0,ty=0,em=0,eq=0,ey=0;
  state.trips.forEach(function(t){
    var d=new Date(t.datum+'T12:00:00'); if(d.getFullYear()!==y) return;
    var k=t.km||0, e=k*tripRate(t);
    ty+=k; ey+=e;
    if(Math.floor(d.getMonth()/3)===q){ tq+=k; eq+=e; if(d.getMonth()===m){ tm+=k; em+=e; } }
  });
  function col(label,k,e){ return '<div class="tot"><div class="tot-label">'+label+'</div><div class="tot-km">'+nf.format(round1(k))+' <small>km</small></div><div class="tot-eur">'+eur.format(e)+'</div></div>'; }
  return '<div class="totals">'+col('Deze maand',tm,em)+col('Dit kwartaal',tq,eq)+col('Dit jaar',ty,ey)+'</div>';
}

function listHTML(){
  var trips=sortedTrips();
  if(!trips.length) return '<p class="empty">Nog geen ritten. Tik op ‘Ik ga rijden’ voor je eerste rit.</p>';
  var groups={}, order=[];
  trips.forEach(function(t){ var k=t.datum.slice(0,7); if(!groups[k]){ groups[k]=[]; order.push(k);} groups[k].push(t); });
  order.sort().reverse();
  return order.map(function(k){
    var g=groups[k], km=0, e=0;
    g.forEach(function(t){ km+=t.km||0; e+=(t.km||0)*tripRate(t); });
    var label=new Date(k+'-01T12:00:00').toLocaleDateString('nl-NL',{month:'long',year:'numeric'});
    return '<div class="month"><h2>'+esc(label)+'</h2><span>'+nf.format(round1(km))+' km, '+eur.format(e)+'</span></div>'+
      g.map(function(t){
        var date=new Date(t.datum+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'});
        return '<button class="row" type="button" data-act="edit" data-id="'+esc(t.id)+'">'+
          '<span class="r-date">'+esc(date)+'</span>'+
          '<span><span class="r-route">'+esc(t.van)+' naar '+esc(t.naar)+'</span><span class="r-sub">'+esc(t.doel)+(t.klant?', '+esc(t.klant):'')+'</span></span>'+
          '<span class="r-km">'+nf.format(t.km)+' km<small>'+eur.format((t.km||0)*tripRate(t))+'</small></span></button>';
      }).join('');
  }).join('');
}

function footHTML(){
  var years={}; state.trips.forEach(function(t){ years[t.datum.slice(0,4)]=1; });
  var ys=Object.keys(years).sort().reverse();
  if(!ys.length) return '<footer class="foot"><p class="note">'+noteText()+'</p></footer>';
  if(ys.indexOf(state.exportYear)<0 && state.exportYear!=='all') state.exportYear=ys[0];
  return '<footer class="foot"><div class="export">'+
    '<label for="exYear" class="odo-label" style="margin:0">Exporteren voor</label>'+
    '<select id="exYear">'+ys.map(function(y){return '<option value="'+y+'"'+(y===state.exportYear?' selected':'')+'>'+y+'</option>';}).join('')+
    '<option value="all"'+(state.exportYear==='all'?' selected':'')+'>Alle jaren</option></select>'+
    '<button class="btn-line" type="button" data-act="export">Download CSV</button></div>'+
    '<p class="note">'+noteText()+'</p></footer>';
}
function noteText(){
  return state.kind==='db'
    ? 'Je ritten worden bewaard onder je account en zijn ook op andere apparaten te zien.'
    : 'Je ritten staan alleen in deze browser. Wis je browsergegevens niet, en exporteer af en toe een back-up.';
}

function render(){
  var app=$('#app');
  app.innerHTML =
    '<header class="top"><h1>Ritten</h1><button class="link" type="button" data-act="settings">Instellingen</button></header>'+
    (state.active ? heroLive() : heroIdle())+totalsHTML()+listHTML()+footHTML();
}
setInterval(function(){ var el=document.getElementById('elapsed'); if(el && state.active) el.textContent=elapsedText(state.active.start); },20000);

/* ---------- sheet ---------- */
function openSheet(html, mount){
  var d=$('#sheet'); d.innerHTML=html; if(!d.open) d.showModal(); if(mount) mount(d);
}
function closeSheet(){ var d=$('#sheet'); if(d.open) d.close(); }
function head(title){ return '<header class="sh-head"><h2 id="sheetTitle">'+esc(title)+'</h2><button class="x" type="button" data-act="close" aria-label="Sluiten">×</button></header>'; }
function showErr(msg, focusEl){ var e=$('#formErr'); if(e) e.textContent=msg||''; if(focusEl && msg){ try{ focusEl.focus(); }catch(x){} } }

/* start */
function startRide(){
  var k=lastKm();
  if(k!=null){ store.setActive({start:new Date().toISOString(), beginKm:k}).catch(function(){ toast('Starten is niet gelukt. Probeer het nog eens.'); }); }
  else openStartSheet();
}
function openStartSheet(){
  openSheet('<div class="sheet-in">'+head('Kilometerstand')+
    '<p class="sub">Wat staat er nu op je kilometerteller? Dit vul je maar één keer in, daarna onthoudt de tool je laatste stand.</p>'+
    '<form id="startForm" novalidate><label class="l" for="s-km">Kilometerstand</label>'+
    '<input class="in" id="s-km" name="km" inputmode="numeric" autocomplete="off" placeholder="bijvoorbeeld 84213">'+
    '<p class="err" id="formErr" role="alert"></p>'+
    '<button class="btn-primary" type="submit">Start rit</button>'+
    '<button class="btn-quiet" type="button" data-act="start-unknown">Ik weet de stand niet, start zonder</button></form></div>',
  function(d){
    $('#startForm',d).addEventListener('submit',function(e){
      e.preventDefault();
      var v=numStand($('#s-km',d).value);
      if(isNaN(v)||v<=0){ showErr('Vul je kilometerstand in, of kies "start zonder".',$('#s-km',d)); return; }
      doStart(v);
    });
    setTimeout(function(){ $('#s-km',d).focus(); },50);
  });
}
function doStart(beginKm){
  store.setActive({start:new Date().toISOString(), beginKm:beginKm}).then(closeSheet).catch(function(){ showErr('Starten is niet gelukt. Probeer het nog eens.'); });
}

/* trip sheet */
function placesList(){
  var seen={}, out=[]; sortedTrips().forEach(function(t){ [t.naar,t.van].forEach(function(p){ if(p && !seen[p] && out.length<30){ seen[p]=1; out.push(p);} }); }); return out;
}
function klantenList(){
  var seen={}, out=[]; sortedTrips().forEach(function(t){ if(t.klant && !seen[t.klant] && out.length<30){ seen[t.klant]=1; out.push(t.klant);} }); return out;
}

function openTripSheet(ctx){
  var t=ctx.trip||{}, a=state.active;
  var mode='km', begin='', eind='', km='', datum=todayISO(), van='', naar='', doel='', anders='', klant='';
  var rate=state.settings.rate;
  if(ctx.kind==='finish'){
    datum=isoDate(new Date(a.start)); begin=a.beginKm!=null?String(a.beginKm):''; mode=a.beginKm!=null?'stand':'km'; van=lastNaar();
  } else if(ctx.kind==='manual'){
    var lk=lastKm(); begin=lk!=null?String(lk):''; mode='km'; van=lastNaar();
  } else {
    datum=t.datum; van=t.van||''; naar=t.naar||''; klant=t.klant||''; rate=tripRate(t);
    if(t.beginKm!=null && t.eindKm!=null){ mode='stand'; begin=String(t.beginKm); eind=String(t.eindKm); } else { mode='km'; km=String(t.km).replace('.',','); }
    if(DOELEN.indexOf(t.doel)>=0) doel=t.doel; else if(t.doel){ doel='Anders'; anders=t.doel; }
  }
  var title = ctx.kind==='finish' ? 'Rit afronden' : ctx.kind==='manual' ? 'Rit achteraf invullen' : 'Rit aanpassen';
  var showDatum = ctx.kind!=='finish';
  var chips = DOELEN.map(function(x){
    return '<label class="chip"><input type="radio" name="doel" value="'+esc(x)+'"'+(x===doel?' checked':'')+'><span>'+esc(x)+'</span></label>';
  }).join('');

  var html='<div class="sheet-in">'+head(title)+
    '<form id="tripForm" novalidate data-mode="'+mode+'">'+
    (showDatum ? '<label class="l" for="f-datum">Datum</label><input class="in" type="date" id="f-datum" name="datum" value="'+esc(datum)+'" max="'+todayISO()+'">' : '')+
    '<div class="seg" role="group" aria-label="Hoe wil je de afstand invullen?">'+
      '<button type="button" data-act="mode" data-m="stand" aria-pressed="'+(mode==='stand')+'">Kilometerstand</button>'+
      '<button type="button" data-act="mode" data-m="km" aria-pressed="'+(mode==='km')+'">Aantal km</button></div>'+
    '<div id="grp-stand"'+(mode==='stand'?'':' hidden')+'>'+
      '<label class="l" for="f-begin">Beginstand</label><input class="in" id="f-begin" name="begin" inputmode="numeric" autocomplete="off" value="'+esc(begin)+'">'+
      '<p class="sub">Privé gereden sinds je laatste rit? Pas de beginstand dan aan.</p>'+
      '<label class="l" for="f-eind">Eindstand</label><input class="in" id="f-eind" name="eind" inputmode="numeric" autocomplete="off" value="'+esc(eind)+'"></div>'+
    '<div id="grp-km"'+(mode==='km'?'':' hidden')+'>'+
      '<label class="l" for="f-km">Gereden kilometers</label><input class="in" id="f-km" name="km" inputmode="decimal" autocomplete="off" value="'+esc(km)+'">'+
      (ctx.kind==='edit' ? '' : '<label class="check"><input type="checkbox" name="retour"> Heen en terug (aantal verdubbelen)</label>')+'</div>'+
    '<p class="calc" id="calc" aria-live="polite"></p>'+
    '<label class="l" for="f-van">Van</label><input class="in" id="f-van" name="van" list="dl-places" autocomplete="off" value="'+esc(van)+'">'+
    '<label class="l" for="f-naar">Naar</label><input class="in" id="f-naar" name="naar" list="dl-places" autocomplete="off" value="'+esc(naar)+'">'+
    '<datalist id="dl-places">'+placesList().map(function(p){return '<option value="'+esc(p)+'">';}).join('')+'</datalist>'+
    '<div class="l" style="margin-top:18px" id="doelLabel">Doel van de rit</div><div class="chips" role="radiogroup" aria-labelledby="doelLabel">'+chips+'</div>'+
    '<div id="grp-anders"'+(doel==='Anders'?'':' hidden')+'><label class="l" for="f-anders">Welk doel?</label><input class="in" id="f-anders" name="anders" autocomplete="off" value="'+esc(anders)+'"></div>'+
    '<label class="l" for="f-klant">Klant of project (optioneel)</label><input class="in" id="f-klant" name="klant" list="dl-klanten" autocomplete="off" value="'+esc(klant)+'">'+
    '<datalist id="dl-klanten">'+klantenList().map(function(p){return '<option value="'+esc(p)+'">';}).join('')+'</datalist>'+
    '<p class="err" id="formErr" role="alert"></p>'+
    '<button class="btn-primary" type="submit">Rit opslaan</button>'+
    (ctx.kind==='edit' ? '<button class="btn-danger" type="button" data-act="del-arm">Rit verwijderen</button>' : '')+
    '</form></div>';

  openSheet(html, function(d){
    var form=$('#tripForm',d), f=form.elements;
    function recalc(){
      var m=form.dataset.mode, km=NaN;
      if(m==='stand'){ var b=numStand(f.begin.value), e=numStand(f.eind.value); if(!isNaN(b)&&!isNaN(e)&&e>b) km=e-b; }
      else { var k=numKm(f.km.value); if(!isNaN(k)&&k>0) km=(f.retour&&f.retour.checked)?k*2:k; }
      $('#calc',d).textContent = isNaN(km) ? '' : 'Gereden: '+nf.format(round1(km))+' km, '+eur.format(km*rate);
    }
    form.addEventListener('input',function(e){
      if(e.target.name==='doel'){ $('#grp-anders',d).hidden = e.target.value!=='Anders'; }
      showErr(''); recalc();
    });
    form.addEventListener('change',function(e){ if(e.target.name==='doel'){ $('#grp-anders',d).hidden = e.target.value!=='Anders'; if(e.target.value==='Anders') f.anders.focus(); } recalc(); });
    form.addEventListener('submit',function(e){
      e.preventDefault();
      var m=form.dataset.mode, b=null, en=null, km;
      function fail(msg,el){ showErr(msg,el); }
      if(showDatum){
        if(!f.datum.value) return fail('Kies de datum van de rit.',f.datum);
        if(f.datum.value>todayISO()) return fail('De datum ligt in de toekomst.',f.datum);
      }
      if(m==='stand'){
        b=numStand(f.begin.value); en=numStand(f.eind.value);
        if(isNaN(b)) return fail('Vul je beginstand in, of kies "Aantal km".',f.begin);
        if(isNaN(en)) return fail('Vul de eindstand van je kilometerteller in.',f.eind);
        if(en<=b) return fail('De eindstand moet hoger zijn dan de beginstand ('+nfi.format(b)+').',f.eind);
        km=round1(en-b);
      } else {
        km=numKm(f.km.value);
        if(isNaN(km)||km<=0) return fail('Vul in hoeveel kilometers je gereden hebt.',f.km);
        if(f.retour && f.retour.checked) km=km*2;
        km=round1(km);
      }
      if(km>3000) return fail('Dat zijn '+nfi.format(km)+' km voor één rit. Controleer je invoer.', m==='stand'?f.eind:f.km);
      var v=f.van.value.trim(); if(!v) return fail('Vul in waar je vertrok.',f.van);
      var n=f.naar.value.trim(); if(!n) return fail('Vul in waar je naartoe ging.',f.naar);
      var sel=form.querySelector('input[name="doel"]:checked');
      if(!sel) return fail('Kies het doel van de rit.',form.querySelector('input[name="doel"]'));
      var dl=sel.value;
      if(dl==='Anders'){ dl=f.anders.value.trim(); if(!dl) return fail('Vul in wat het doel van de rit was.',f.anders); }
      var kl=f.klant.value.trim();
      var trip;
      if(ctx.kind==='finish'){
        trip={id:newId(),datum:datum,start:a.start,eind:new Date().toISOString(),beginKm:b,eindKm:en,km:km,van:v,naar:n,doel:dl,klant:kl,rate:state.settings.rate,ts:Date.now()};
      } else if(ctx.kind==='manual'){
        trip={id:newId(),datum:f.datum.value,start:null,eind:null,beginKm:b,eindKm:en,km:km,van:v,naar:n,doel:dl,klant:kl,rate:state.settings.rate,ts:noonTs(f.datum.value)};
      } else {
        trip=Object.assign({},t,{beginKm:b,eindKm:en,km:km,van:v,naar:n,doel:dl,klant:kl});
        if(f.datum.value!==t.datum){ trip.datum=f.datum.value; trip.start=null; trip.eind=null; trip.ts=noonTs(f.datum.value); }
      }
      store.saveTrip(trip).then(function(){
        return ctx.kind==='finish' ? store.setActive(null) : null;
      }).then(function(){
        closeSheet(); toast(ctx.kind==='edit' ? 'Rit aangepast' : 'Rit opgeslagen: '+nf.format(km)+' km');
      }).catch(function(){ showErr('Opslaan is niet gelukt. Probeer het nog eens.'); });
    });
    d._ctx=ctx; d._recalc=recalc;
    recalc();
    if(ctx.kind==='finish'){ setTimeout(function(){ (mode==='stand'?f.eind:f.km).focus(); },60); }
  });
}

function setMode(m){
  var d=$('#sheet'), form=$('#tripForm',d); if(!form) return;
  form.dataset.mode=m;
  form.querySelectorAll('[data-m]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.m===m)); });
  $('#grp-stand',d).hidden = m!=='stand'; $('#grp-km',d).hidden = m!=='km';
  showErr(''); if(d._recalc) d._recalc();
}

function openCancelSheet(){
  openSheet('<div class="sheet-in">'+head('Rit annuleren?')+
    '<p class="sub">Er wordt niets opgeslagen voor deze rit.</p>'+
    '<button class="btn-primary" type="button" data-act="cancel-yes">Ja, annuleer de rit</button>'+
    '<button class="btn-quiet" type="button" data-act="close">Nee, de rit loopt door</button></div>');
}

function openSettings(){
  openSheet('<div class="sheet-in">'+head('Instellingen')+
    '<form id="setForm" novalidate><label class="l" for="s-rate">Tarief per kilometer (euro)</label>'+
    '<input class="in" id="s-rate" inputmode="decimal" autocomplete="off" value="'+esc(String(state.settings.rate).replace('.',','))+'">'+
    '<p class="sub">Het tarief wordt bij elke rit onthouden. Als je het wijzigt, houden oudere ritten hun eigen tarief. Controleer welk tarief voor jouw situatie geldt.</p>'+
    '<p class="err" id="formErr" role="alert"></p>'+
    '<button class="btn-primary" type="submit">Opslaan</button></form></div>',
  function(d){
    $('#setForm',d).addEventListener('submit',function(e){
      e.preventDefault();
      var r=numKm($('#s-rate',d).value);
      if(isNaN(r)||r<=0||r>5){ showErr('Vul een tarief in tussen 0,01 en 5,00 euro.',$('#s-rate',d)); return; }
      store.setSettings({rate:Math.round(r*10000)/10000}).then(function(){ closeSheet(); toast('Tarief opgeslagen'); }).catch(function(){ showErr('Opslaan is niet gelukt.'); });
    });
  });
}

/* ---------- export ---------- */
function csvCell(v){
  var s=String(v==null?'':v);
  if(/^[=+\-@]/.test(s)) s="'"+s;
  return /[;"\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function dec(n){ return String(n).replace('.',','); }
function csvFor(year){
  var rows=[['Datum','Vertrek','Aankomst','Beginstand','Eindstand','Kilometers','Van','Naar','Doel','Klant of project','Tarief per km','Bedrag']];
  state.trips.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);}).forEach(function(t){
    if(year!=='all' && t.datum.slice(0,4)!==year) return;
    var r=tripRate(t);
    rows.push([t.datum, t.start?timeStr(t.start):'', t.eind?timeStr(t.eind):'', t.beginKm!=null?t.beginKm:'', t.eindKm!=null?t.eindKm:'',
      dec(t.km), t.van, t.naar, t.doel, t.klant||'', dec(r), dec((Math.round((t.km||0)*r*100)/100).toFixed(2))]);
  });
  return '\ufeff'+rows.map(function(r){ return r.map(csvCell).join(';'); }).join('\r\n');
}
function doExport(){
  var y=state.exportYear, data=csvFor(y), name='ritten-'+(y==='all'?'alle-jaren':y)+'.csv';
  function fallback(){
    openSheet('<div class="sheet-in">'+head('Ritten als tekst')+
      '<p class="sub">Downloaden lukt hier niet. Kopieer de tekst en plak hem in een bestand of spreadsheet.</p>'+
      '<textarea class="in" id="csvText" readonly>'+esc(data.replace('\ufeff',''))+'</textarea>'+
      '<button class="btn-primary" type="button" data-act="select-all">Alles selecteren</button></div>');
  }
  if(!state.downloads){ fallback(); return; }
  state.downloads.save({filename:name,data:data}).then(function(){ toast('Bestand klaar'); }).catch(function(e){ if(e && e.code==='declined') return; fallback(); });
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  var d=$('#sheet');
  if(d.open && e.target===d){ closeSheet(); return; }
  if(!b) return;
  var act=b.dataset.act;
  if(act==='start') startRide();
  else if(act==='start-unknown') doStart(null);
  else if(act==='manual') openTripSheet({kind:'manual'});
  else if(act==='finish') openTripSheet({kind:'finish'});
  else if(act==='cancel') openCancelSheet();
  else if(act==='cancel-yes'){ store.setActive(null).then(closeSheet).catch(function(){ toast('Annuleren is niet gelukt.'); }); }
  else if(act==='edit'){ var t=state.trips.find(function(x){return x.id===b.dataset.id;}); if(t) openTripSheet({kind:'edit',trip:t}); }
  else if(act==='settings') openSettings();
  else if(act==='export') doExport();
  else if(act==='close') closeSheet();
  else if(act==='mode') setMode(b.dataset.m);
  else if(act==='select-all'){ var ta=$('#csvText'); if(ta){ ta.focus(); ta.select(); } }
  else if(act==='del-arm'){
    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='Zeker weten? Tik nogmaals om te verwijderen'; }
    else { var tr=d._ctx && d._ctx.trip; if(tr) store.deleteTrip(tr.id).then(function(){ closeSheet(); toast('Rit verwijderd'); }).catch(function(){ showErr('Verwijderen is niet gelukt.'); }); }
  }
});
document.addEventListener('change',function(e){ if(e.target && e.target.id==='exYear'){ state.exportYear=e.target.value; } });

/* ---------- boot ---------- */
function withTimeout(p,ms){ return Promise.race([p, new Promise(function(r){ setTimeout(function(){ r(null); },ms); })]); }
function boot(){
  var c=window.claude;
  if(!c || !c.use){ store=makeLocalStore(); state.kind='local'; render(); return; }
  Promise.all([
    withTimeout(c.use('db').catch(function(){return null;}),4000),
    withTimeout(c.use('user').catch(function(){return null;}),4000),
    withTimeout(c.use('downloads').catch(function(){return null;}),4000)
  ]).then(function(r){
    state.downloads=r[2]||null;
    if(r[0] && r[1]){
      return Promise.resolve(r[1].id()).then(function(uid){
        if(uid){ store=makeDbStore(r[0],uid); state.kind='db'; }
        else { store=makeLocalStore(); state.kind='local'; render(); }
      });
    }
    store=makeLocalStore(); state.kind='local'; render();
  }).catch(function(){ store=makeLocalStore(); state.kind='local'; render(); });
}
boot();
})();
</script>
